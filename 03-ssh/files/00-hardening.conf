# SSH hardening (CIS Benchmark)
# Named 00- so it is read first: for each setting, sshd uses the first value it finds.
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
# Only these users can log in over SSH. Change "admin" to your own user(s), separated by spaces.
AllowUsers admin
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
HostbasedAuthentication no
PermitUserEnvironment no
LoginGraceTime 60
MaxStartups 10:30:60
MaxSessions 4
Banner /etc/issue.net
LogLevel VERBOSE
